repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        # Use the already-provisioned environment (CI installs all extras except
        # ppisp, whose CUDA extension cannot build without a CUDA toolkit). Without
        # --no-sync, `uv run` would re-sync and rebuild ppisp, failing the hook in
        # CUDA-free environments.
        entry: uv run --no-sync ty check
        language: system
        types: [python]
        pass_filenames: false
