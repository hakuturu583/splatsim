[project]
name = "splatsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gsplat==1.5.3",
    "torch==2.4.0+cu124",
    "torchvision==0.19.0+cu124",
    "3dgs-io",
    "pygame>=2.5.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]

torchvision = [
  { index = "pytorch-cu124" },
]

3dgs-io = { git = "https://github.com/tier4/3dgs_io.git", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a0",
    "mypy>=1.10.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
