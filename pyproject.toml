[project]
name = "splatsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gsplat==1.5.3",
    "torch==2.4.0+cu124",
    "torchvision==0.19.0+cu124",
    "3dgs-io",
    "PyQt5>=5.15.0",
    "pyyaml>=6.0",
    "setuptools",
    "autoware-carla-scenario[carla-0-9-16]",
    "autoware-lanelet2-to-opendrive",
    "cyclonedds>=11.0.1",
    "python-dotenv>=1.0.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "numpy>=2.1,<2.3",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]

torchvision = [
  { index = "pytorch-cu124" },
]

3dgs-io = { git = "https://github.com/tier4/3dgs_io.git", branch = "main" }

autoware-carla-scenario = { git = "https://github.com/tier4/autoware_lanelet2_to_opendrive.git", tag = "v2.54.0", subdirectory = "autoware_carla_scenario" }
autoware-lanelet2-to-opendrive = { git = "https://github.com/tier4/autoware_lanelet2_to_opendrive.git", tag = "v2.54.0", subdirectory = "autoware_lanelet2_to_opendrive" }
lanelet2-python-api-for-autoware = { git = "https://github.com/tier4/lanelet2_python_api_for_autoware", rev = "7745347645fd04aa8e4230cfa8793e253aad6753" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a0",
    "mypy>=1.10.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
viewer = "splatsim.viewer:main"
spawn-scenario = "scenarios.odaibatest_spawn.run:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
