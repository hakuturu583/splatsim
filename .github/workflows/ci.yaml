name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install system dependencies for lanelet2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-serialization-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            libboost-python-dev \
            libeigen3-dev \
            libpugixml-dev \
            libgeographiclib-dev
          # GeographicLib v2 renamed libGeographic to libGeographicLib; create compat symlink
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libGeographicLib.so /usr/lib/x86_64-linux-gnu/libGeographic.so

      - name: Configure git for private dependencies
        run: git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
