name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install system dependencies for lanelet2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-dev \
            libboost-serialization-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            libboost-python-dev \
            libboost-system-dev \
            libeigen3-dev \
            libpugixml-dev \
            libgeographic-dev \
            librange-v3-dev \
            python3-dev

      - name: Configure git for private dependencies
        run: git config --global url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare git credentials for private dependencies
        run: |
          printf '[url "https://x-access-token:%s@github.com/"]\n\tinsteadOf = https://github.com/\n' \
            "${{ secrets.GH_TOKEN }}" > /tmp/.gitconfig

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          secrets: |
            gitconfig=/tmp/.gitconfig
          cache-from: type=gha
          cache-to: type=gha,mode=max
