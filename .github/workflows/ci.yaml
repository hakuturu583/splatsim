name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install system dependencies for lanelet2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-dev \
            libboost-serialization-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            libboost-python-dev \
            libboost-system-dev \
            libeigen3-dev \
            libpugixml-dev \
            libgeographic-dev \
            librange-v3-dev \
            python3-dev

      - name: Install dependencies
        # ppisp ships a CUDA extension (ppisp_cuda) whose setup.py unconditionally
        # constructs a torch CUDAExtension, which requires CUDA_HOME/nvcc even to
        # resolve its build requirements. This lint-only job runs without the CUDA
        # toolkit (BUILD_NO_CUDA=1), so skip building ppisp here. splatsim never
        # imports it statically (it is loaded lazily via importlib at render time),
        # so linting and type-checking are unaffected.
        #
        # Provision every extra (minus ppisp) up front so the `ty` pre-commit hook
        # can run with `uv run --no-sync` against this environment instead of
        # re-syncing and re-triggering the ppisp build.
        run: uv sync --dev --all-extras --no-install-package ppisp
        env:
          BUILD_NO_CUDA: "1"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  docker-build:
    runs-on: ubuntu-22.04
    # Mirror the per-arch fan-out used by the release publish job so PR-time
    # validation compiles each GPU architecture in parallel instead of building
    # all six compute capabilities serially in one image.
    strategy:
      fail-fast: false
      matrix:
        arch: ["7.5", "8.0", "8.6", "8.9", "9.0", "12.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute cache scope
        id: scope
        run: echo "sm=sm$(echo '${{ matrix.arch }}' | tr -d '.')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            TORCH_CUDA_ARCH_LIST=${{ matrix.arch }}
          # Share the cache scope with the release publish job so a PR build
          # warms the cache the release reuses (and arches don't clobber).
          cache-from: type=gha,scope=${{ steps.scope.outputs.sm }}
          cache-to: type=gha,scope=${{ steps.scope.outputs.sm }},mode=min
