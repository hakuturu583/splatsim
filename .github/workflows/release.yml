name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.pr.outputs.bump }}
      version: ${{ steps.bump.outputs.next }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Get merged PR and check for release label
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_json=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq '.[0] // empty' 2>/dev/null || true)
          if [ -z "$pr_json" ]; then
            echo "No PR associated with this push — skipping release"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels=$(echo "$pr_json" | jq -r '[.labels[].name] | join(",")')
          bump=none
          count=0
          for lvl in major minor patch; do
            if echo ",$labels," | grep -q ",release:${lvl},"; then
              bump=$lvl
              count=$((count + 1))
            fi
          done
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple release labels found — pick exactly one"
            exit 1
          fi
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "Resolved bump level: ${bump}"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.bump != 'none'
        with:
          ref: master
          fetch-depth: 0

      - name: Install uv
        if: steps.pr.outputs.bump != 'none'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.pr.outputs.bump != 'none'
        run: uv python install

      - name: Bump version
        if: steps.pr.outputs.bump != 'none'
        id: bump
        run: |
          set -euo pipefail
          uv version --bump "${{ steps.pr.outputs.bump }}" --frozen
          next=$(
          python3 - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path("pyproject.toml").read_text()
          project = re.search(r'(?ms)^\[project\]\n(.*?)(?=^\[|\Z)', pyproject)
          if project is None:
              raise SystemExit("failed to find [project] in pyproject.toml")
          version_match = re.search(r'(?m)^version = "([^"]+)"', project.group(1))
          if version_match is None:
              raise SystemExit("failed to find project version in pyproject.toml")
          version = version_match.group(1)

          lock_path = Path("uv.lock")
          lock = lock_path.read_text()
          pattern = re.compile(r'(?m)(\[\[package\]\]\nname = "splatsim"\nversion = )"[^"]+"')
          lock, count = pattern.subn(lambda match: f'{match.group(1)}"{version}"', lock, count=1)
          if count != 1:
              raise SystemExit("failed to update splatsim version in uv.lock")
          lock_path.write_text(lock)
          print(version)
          PY
          )
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${next} (${{ steps.pr.outputs.bump }})"

      - name: Fail if tag already exists
        if: steps.pr.outputs.bump != 'none'
        run: |
          if git rev-parse "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.bump.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Configure git
        if: steps.pr.outputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, and push
        if: steps.pr.outputs.bump != 'none'
        id: commit
        run: |
          set -euo pipefail
          git add pyproject.toml uv.lock
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "HEAD:master"
          git push origin "${{ steps.bump.outputs.tag }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.pr.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --target "${{ steps.commit.outputs.sha }}" \
            --generate-notes

  # Build the runtime image and publish it to GHCR so it can be pulled with
  # `docker pull`. This runs as a follow-up to `release` (rather than a separate
  # `on: push: tags` workflow) because the release tag is pushed with
  # GITHUB_TOKEN, and token-pushed tags do not trigger new workflow runs.
  docker-publish:
    needs: release
    if: needs.release.outputs.bump != 'none'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      # Single source of truth for the CUDA/Ubuntu build args. Keep in sync with
      # the defaults in docker/Dockerfile.
      CUDA_VERSION: "12.8.1"
      UBUNTU_VERSION: "22.04"
    # One image per GPU architecture. Compiling all six compute capabilities in
    # a single image serializes the gsplat CUDA build and blows past sensible CI
    # times, so we fan out over TORCH_CUDA_ARCH_LIST: each job compiles exactly
    # one arch (~1/6 the kernels) in parallel and publishes an arch-specific tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "7.5"   # Turing        — RTX 20xx
            sm: "75"
          - arch: "8.0"   # Ampere        — A100
            sm: "80"
          - arch: "8.6"   # Ampere        — RTX 30xx
            sm: "86"
          - arch: "8.9"   # Ada Lovelace  — RTX 40xx
            sm: "89"
          - arch: "9.0"   # Hopper        — H100
            sm: "90"
          - arch: "12.0"  # Blackwell     — RTX 50xx
            sm: "120"
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          # Repository owner/name may contain uppercase; GHCR image names must be lowercase.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          version="${{ needs.release.outputs.version }}"
          platform_slug="cuda${CUDA_VERSION}-sm${{ matrix.sm }}"
          {
            echo "tags<<EOF"
            echo "${image}:${version}-${platform_slug}"
            echo "${image}:latest-sm${{ matrix.sm }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: ${image}:${version}-${platform_slug}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
            TORCH_CUDA_ARCH_LIST=${{ matrix.arch }}
          # Scope the cache per arch so parallel matrix jobs don't clobber each
          # other's layers.
          cache-from: type=gha,scope=sm${{ matrix.sm }}
          cache-to: type=gha,scope=sm${{ matrix.sm }},mode=min
